<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f6b5e">
  <meta name="description" content="個人投資決策儀表板：資產體檢、下單前檢查、定期定額與大跌加碼規則">
  <title>投資儀表板</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand">投資儀表板</a>
    <nav class="topnav" aria-label="主要功能">
      <a href="#/" data-tab="home">總覽</a>
      <a href="#/holdings" data-tab="holdings">持倉</a>
      <a href="#/structure" data-tab="structure">結構</a>
      <a href="#/market" data-tab="market">市場</a>
      <a href="#/risk" data-tab="risk">風控</a>
      <a href="#/check" data-tab="check">下單前</a>
      <a href="#/plan" data-tab="plan">定投</a>
      <a href="#/journal" data-tab="journal">日誌</a>
    </nav>
    <div class="topbar-right">
      <a href="#/" id="top-score" class="chip" aria-label="紀律分數"></a>
      <a href="#/settings" class="icon-btn" data-tab="settings" aria-label="設定" title="設定">⚙️</a>
    </div>
  </header>

  <div id="banner-root"></div>
  <main id="app" class="container" tabindex="-1">
    <p class="muted center">載入中…</p>
  </main>

  <nav class="tabbar" aria-label="主要功能（手機）">
    <a href="#/" data-tab="home"><span class="tab-icon">🏠</span><span>總覽</span></a>
    <a href="#/holdings" data-tab="holdings"><span class="tab-icon">💼</span><span>持倉</span></a>
    <a href="#/check" data-tab="check"><span class="tab-icon">✅</span><span>下單前</span></a>
    <a href="#/plan" data-tab="plan"><span class="tab-icon">📅</span><span>定投</span></a>
    <button type="button" id="more-btn" aria-expanded="false" aria-controls="more-sheet"><span class="tab-icon">☰</span><span>更多</span></button>
  </nav>
  <div id="more-sheet" class="sheet" hidden>
    <div class="sheet-card" role="dialog" aria-label="更多分頁">
      <a href="#/structure" data-tab="structure"><span>🧺</span>結構</a>
      <a href="#/market" data-tab="market"><span>📈</span>市場</a>
      <a href="#/risk" data-tab="risk"><span>🧯</span>風控</a>
      <a href="#/journal" data-tab="journal"><span>📓</span>日誌</a>
      <a href="#/settings" data-tab="settings"><span>⚙️</span>設定</a>
    </div>
  </div>

  <div id="toast-root" aria-live="polite"></div>
  <div id="modal-root"></div>

  <script type="module" src="js/app.js"></script>

</html>
