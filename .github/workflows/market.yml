# 每天自動抓市場資料，有變動才提交 data/market.json
# 手動執行：GitHub 儲存庫 → Actions → 更新市場資料 → Run workflow
name: 更新市場資料

on:
  schedule:
    # UTC 時間；台灣時間 22:17（證交所融資資料公布後）與 06:17（美股收盤後），週一到週五
    - cron: '17 14,22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 抓資料
        run: node tools/fetch-market.mjs
      - name: 有變動才提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json
          if git diff --cached --quiet; then
            echo "沒有新資料"
            exit 0
          fi
          git commit -m "更新市場資料 $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
